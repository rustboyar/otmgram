[package]
name = "otmgram-film"
version = "0.1.0"
edition = "2021"
description = "Otmgram's bridge to tungsten's film looks (github.com/ian-te/tungsten), for Android"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# tungsten's core, pinned; its command line (and the image crate) left out.
cinestill = { git = "https://github.com/ian-te/tungsten", rev = "5d1e1da7d3743d3276912bfc666647b78099c557", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
